name: Build gu-native Stable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3-dev curl unzip
        shell: bash

      - name: Set up Python Virtual Environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
        shell: bash

      - name: Download and extract gu-native source
        run: |
          curl -L https://github.com/MonsterHunterGenUltimate/gu-native/archive/refs/heads/main.zip -o gu.zip
          unzip -q gu.zip
          mv gu-native-main temp-gu
          mkdir -p temp-gu/exefs
          cp -r ${{ github.workspace }}/exefs/* temp-gu/exefs/
        shell: bash

      - name: Run build script
        run: |
          source venv/bin/activate
          cd temp-gu
          python3 tools/build_game.py --exefs ./exefs
        shell: bash

      - name: Prepare artifacts
        run: |
          mkdir -p final-output
          cp temp-gu/build/libmhgugame.so final-output/
          cp temp-gu/build/libmhgugame.id final-output/
        shell: bash

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gu-native-binaries
          path: final-output/*
