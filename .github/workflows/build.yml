name: Build gu-native

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository (with exefs)
        uses: actions/checkout@v4

      - name: Clone gu-native repository
        uses: actions/checkout@v4
        with:
          repository: 'MonsterHunterGenUltimate/gu-native'
          token: ${{ secrets.GITHUB_TOKEN }}
          path: 'gu-native'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3-dev
          pip install --upgrade pip

      - name: Verify exefs folder location
        run: |
          ls -la ${{ github.workspace }}/exefs

      - name: Run build script
        run: |
          python3 gu-native/tools/build_game.py --exefs ${{ github.workspace }}/exefs
        shell: bash

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gu-native-binaries
          path: |
            gu-native/build/libmhgugame.so
            gu-native/build/libmhgugame.id
